repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]
      - id: prettier
        name: Prettier
        entry: npx --yes prettier@3.6.2 --write
        language: system
        types_or: [markdown, json, yaml]
